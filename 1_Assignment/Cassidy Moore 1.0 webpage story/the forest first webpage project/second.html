<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>The Forest</title>
	<style>
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			color: white;
			text-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
			background-color: #111;
			background-image: url("japanesestreet2.jpg");
			background-position: center center;
			background-size: contain;
			background-repeat: no-repeat;
		}

		#hurry {
			position: fixed;
			top: var(--popup-y, 50%);
			left: var(--popup-x, -20vw);
			width: 14vw;
			padding: 0;
			border: 0;
			background: transparent;
			color: rgba(255, 255, 255, 0.65);
			font: inherit;
			font-size: 0.75rem;
			letter-spacing: 0.15em;
			line-height: 2;
			text-align: center;
			text-transform: uppercase;
			text-shadow: 0 0 3px rgba(255, 255, 255, 0.8);
			transform: translate(-50%, -50%);
			pointer-events: auto;
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.3s ease;
			cursor: pointer;
		}

		body.clicked #hurry {
			opacity: 1;
			visibility: visible;
		}

		.black-transition {
			position: fixed;
			inset: 0;
			background: black;
			opacity: 0;
			pointer-events: none;
			transition: opacity 1.2s ease;
			z-index: 10;
		}

		body.transitioning .black-transition {
			opacity: 1;
		}
	</style>
</head>
<body>
	the fog is getting thicker
	<button id="hurry" type="button">hurry</button>
	<div class="black-transition"></div>
	<script>
		const button = document.getElementById("hurry");
		let hasAppeared = false;

		function startTransition(event) {
			event.stopPropagation();
			document.body.classList.add("transitioning");
			setTimeout(function () {
				window.location.href = "third.html";
			}, 1000);
		}

		document.body.addEventListener("click", (event) => {
			if (hasAppeared || event.target === button) {
				return;
			}

			const horizontalPadding = window.innerWidth * 0.07;
			const x = Math.max(horizontalPadding, Math.min(event.clientX, window.innerWidth - horizontalPadding));

			document.body.style.setProperty("--popup-x", `${x}px`);
			document.body.style.setProperty("--popup-y", `${event.clientY}px`);
			hasAppeared = true;
			document.body.classList.add("clicked");
		});

		button.addEventListener("click", startTransition);
	</script>
</body>
</html>
