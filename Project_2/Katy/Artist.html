<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Artist | Katy Data Profile</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<main class="artist-page">
			<a class="home-button" href="home.html">&#8592; Back home</a>

			<section class="artist-content" aria-labelledby="artist-title">
				<p class="eyebrow">Katy's Data Profile</p>
				<h1 id="artist-title">Artist</h1>

				<div class="about-section">
					<p class="section-label">About</p>
					<p>
						My creative side is full of whimsy. I love to create color characters
						that are full of life! Some of my favorite things to draw are cartoon
						animals, fan art, and stop motion video!
					</p>
					<section class="portrait-section" aria-label="Code drawn portrait">
        <p class="eyebrow">A little portrait</p>
        <div class="code-portrait" role="img" aria-label="A code drawn portrait of a smiling person wearing a colorful cap and sunglasses">
          <div class="portrait-sky"></div>
          <div class="portrait-hair"></div>
          <div class="portrait-shirt"></div>
          <div class="portrait-neck"></div>
          <div class="portrait-face">
            <div class="portrait-ear portrait-ear-left"></div>
            <div class="portrait-ear portrait-ear-right"></div>
						<div class="portrait-eye portrait-eye-left"><span class="portrait-pupil"></span></div>
						<div class="portrait-eye portrait-eye-right"><span class="portrait-pupil"></span></div>
    
            <div class="portrait-nose"></div>
            <div class="portrait-smile"></div>
          </div>
          <div class="portrait-cap">

    
				</div>
			</section>
		</main>

		<script>
			const portrait = document.querySelector('.code-portrait');
			const pupils = document.querySelectorAll('.portrait-pupil');

			portrait.addEventListener('pointermove', (event) => {
				const bounds = portrait.getBoundingClientRect();
				const x = ((event.clientX - bounds.left) / bounds.width) * 2 - 1;
				const y = ((event.clientY - bounds.top) / bounds.height) * 2 - 1;
				const pupilX = Math.max(-5, Math.min(5, x * 5));
				const pupilY = Math.max(-3, Math.min(3, y * 3));

				pupils.forEach((pupil) => {
					pupil.style.transform = `translate(${pupilX}px, ${pupilY}px)`;
				});
			});

			portrait.addEventListener('click', () => {
				portrait.classList.remove('is-blinking');
				void portrait.offsetWidth;
				portrait.classList.add('is-blinking');
			});
		</script>
	</body>
</html>
