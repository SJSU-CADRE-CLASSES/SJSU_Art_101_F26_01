<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Image Fade</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #31424d;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-bg {
      position: absolute;
      inset: 0;
      background-image: url('awesome_field.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0;
      animation: imageFade 6s ease forwards;
    }

    .ringo-link {
      position: absolute;
      left: 10%;
      bottom: 8%;
      transform: translateX(-50%);
      z-index: 2;
      opacity: 0;
      animation: imageFade 6s ease forwards;
    }

    .ringo-link img {
      opacity: 0.08;
      width: 180px;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .arrow {
      position: absolute;
      left: 22%;
      bottom: 24%;
      width: 120px;
      height: 120px;
      border-left: 10px solid red;
      border-top: 10px solid red;
      transform: rotate(310deg);
      opacity: 0;
      animation: arrowAppear 30s ease-in-out forwards;
      z-index: 3;
      pointer-events: none;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: white;
      text-align: center;
      font-size: clamp(2rem, 5vw, 4rem);
      opacity: 1;
      animation: textFade 6s ease forwards;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    @keyframes textFade {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes imageFade {
      0% { opacity: 0; }
      70% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes arrowAppear {
      0%, 90% { opacity: 0; }
      95%, 100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="image-bg"></div>
    <div class="arrow"></div>

    <a class="ringo-link" href="index3.html" aria-label="Go to the next page">
      <img src="ringo.png" alt="Ringo" />
    </a>

    <h1>...what is there to learn about me...?</h1>
  </div>
</body>
</html>
