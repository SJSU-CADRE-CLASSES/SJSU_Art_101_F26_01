<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Cafe</title>
    <style>
        :root {
            --ink: #243238;
            --muted: #68767a;
            --cream: #fff9ef;
            --paper: #fffdf9;
            --coral: #ef775f;
            --coral-dark: #cf5a46;
            --mint: #dcefe4;
            --line: #eadfd1;
            --shadow: 0 20px 50px rgba(88, 66, 43, 0.12);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--cream);
            font-family: Georgia, 'Times New Roman', serif;
        }

        .page {
            min-height: 100vh;
            padding: 36px 6vw 54px;
            background: radial-gradient(circle at 90% 0%, #f7dfbb 0 18%, transparent 42%),
                        linear-gradient(135deg, #fff9ef 0%, #f6efe3 100%);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            max-width: 1180px;
            margin: 0 auto 34px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--coral-dark);
            font: 700 0.74rem/1.2 Arial, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1, h2, p { margin-top: 0; }
        h1 {
            max-width: 540px;
            margin-bottom: 12px;
            font-size: clamp(2.6rem, 6vw, 5.3rem);
            line-height: 0.94;
            letter-spacing: -0.04em;
        }

        .intro {
            max-width: 450px;
            margin-bottom: 0;
            color: var(--muted);
            font: 1rem/1.6 Arial, sans-serif;
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            gap: 28px;
            max-width: 1180px;
            margin: 0 auto;
        }

        .menu {
            border: 1px solid rgba(234, 223, 209, 0.9);
            background: rgba(255, 253, 249, 0.78);
            box-shadow: var(--shadow);
        }

        .menu {
            padding: clamp(22px, 4vw, 40px);
            border-radius: 26px;
        }

        .menu-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 20px;
            margin-bottom: 22px;
        }

        h2 { margin-bottom: 0; font-size: 1.65rem; }
        .hint { margin: 0; color: var(--muted); font: 0.82rem Arial, sans-serif; }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .food-card {
            min-width: 0;
            border: 2px solid transparent;
            border-radius: 18px;
            padding: 12px;
            text-align: left;
            color: var(--ink);
            background: white;
            text-decoration: none;
            cursor: pointer;
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .food-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(88, 66, 43, 0.1); }
        .food-art {
            display: grid;
            place-items: center;
            aspect-ratio: 1.3;
            margin-bottom: 12px;
            border-radius: 12px;
            background: var(--mint);
            font-size: clamp(2.5rem, 5vw, 4rem);
        }

        .food-card:nth-child(2n) .food-art { background: #fbe2c8; }
        .food-card:nth-child(3n) .food-art { background: #f5d8dd; }
        .food-name { display: block; margin-bottom: 5px; font-size: 1.12rem; }
        .food-detail { color: var(--muted); font: 0.76rem Arial, sans-serif; }

        @media (max-width: 760px) {
            .page { padding: 24px 18px 36px; }
            header { margin-bottom: 24px; }
            main { grid-template-columns: 1fr; }
            .food-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 390px) {
            header { display: block; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <div>
                <p class="eyebrow">Build a plate you will love</p>
                <h1>What are you hungry for?</h1>
                <p class="intro">Select a food to learn more.</p>
            </div>
        </header>

        <main>
            <section class="menu" aria-label="Food menu">
                <div class="menu-top">
                    <h2>Pick your favorites</h2>
                    <p class="hint">Select a food to continue</p>
                </div>
                <div class="food-grid" id="food-grid"></div>
            </section>
        </main>
    </div>

    <script>
        const foods = [
            { name: 'Cookie', detail: '2017', emoji: '🍪', url:'2017.html'},
            { name: 'Pizza Slice', detail: '2018', emoji: '🍕', url:'2018.html' },
            { name: 'Tacos and Burritos', detail: '2019', emoji: '🌮🌯', url:'2019.html' },
            { name: 'Steak and Fries', detail: '2020', emoji: '🥩🍟', url:'2020.html' },
            { name: 'Ten Patty Burger', detail: '2021', emoji: '🍔', url:'2021.html' },
            { name: 'Four Cakes', detail: '2022', emoji: '🎂🎂🎂🎂', url:'2022.html' },
            { name: 'Big Soda', detail: '2023', emoji: '🥤', url:'2023.html'},
            { name: '?', detail: '', emoji: '❓', url:'question.html' },
        ];
        const foodGrid = document.querySelector('#food-grid');

        function renderFoods() {
            foodGrid.innerHTML = foods
                .map(food => `<a class="food-card" href="${food.url || '2017.html'}">
                    <span class="food-art" aria-hidden="true">${food.emoji}</span>
                    <span class="food-name">${food.name}</span>
                    <span class="food-detail">${food.detail}</span>
                </a>`).join('');
        }

        renderFoods();
    </script>
</body>
</html>
