<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <meta charset="UTF-8">
    <title>HTML Progress Bar Example</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 25px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 10px;
        }
        progress {
            width: 100%;
            height: 25px;
        }
        .delayed-link {
            /* Hide the link initially */
            opacity: 0; 
            pointer-events: none; /* Prevent clicking while hidden */
            
            /* Apply the animation named 'fadeIn' lasting 0.5 seconds */
            animation: fadeIn 0.5s forwards;
            
            /* Change 3s to however many seconds you want to wait */
            animation-delay: 6s; 
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                pointer-events: auto; /* Enable clicking when visible */
            }
        }
    </style>
    <h1>Thank you for waiting, please allow the magic to complete.</h1>
</head>
<body>
    <progress></progress>
       <p>The link will appear below in a few seconds...</p>
    <a href="drumroll.html" class="delayed-link">Click here to complete</a>
<p></p>
</body>
</html>
