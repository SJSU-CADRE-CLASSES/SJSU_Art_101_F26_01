<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entity</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      font-family: inherit;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #111;
      background-image: url("entity.jpg");
      background-position: center center;
      background-size: contain;
      background-repeat: no-repeat;
      position: relative;
      overflow: hidden;
    }

    .veil {
      position: fixed;
      inset: 0;
      background: black;
      opacity: 1;
      transition: opacity 1.4s ease;
      z-index: 10;
    }

    body.loaded .veil {
      opacity: 0;
    }

    .entity {
      position: absolute;
      left: 52%;
      top: 40%;
      width: 105px;
      height: 380px;
      opacity: 0;
      filter: blur(13px) brightness(0.12);
      animation: flash 12s ease-in-out infinite;
      z-index: 1;
      pointer-events: none;
    }

    .entity::before,
    .entity::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.88);
    }

    .entity::before {
      top: 0;
      width: 12px;
      height: 28px;
      border-radius: 46% 54% 50% 50% / 42% 58% 42% 58%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
    }

    .entity::after {
      top: 20px;
      width: 86px;
      height: 350px;
      border-radius: 30% 40% 26% 68% / 12% 15% 84% 88%;
      transform: translateX(-50%) skewY(-12deg);
      box-shadow:
        0 0 20px rgba(0, 0, 0, 0.52),
        -16px 12px 0 -12px rgba(0, 0, 0, 0.6),
        16px 12px 0 -12px rgba(0, 0, 0, 0.58);
    }

    .black-transition {
      position: fixed;
      inset: 0;
      background: black;
      opacity: 1;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 20;
    }

    body.loaded .black-transition {
      opacity: 0;
    }

    @keyframes flash {
      0%, 14%, 16%, 18%, 20%, 22%, 24%, 100% {
        opacity: 0;
      }
      15% {
        opacity: 0.1;
      }
      17% {
        opacity: 0.35;
      }
      19% {
        opacity: 0.12;
      }
      21% {
        opacity: 0.42;
      }
      23% {
        opacity: 0.16;
      }
      25% {
        opacity: 0.5;
      }
      26% {
        opacity: 0.12;
      }
      27% {
        opacity: 0.58;
      }
      29% {
        opacity: 0.08;
      }
      32% {
        opacity: 0.18;
      }
      34%, 76% {
        opacity: 0.28;
      }
      77% {
        opacity: 0.56;
      }
      79%, 100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="veil"></div>
  <div class="entity" aria-hidden="true"></div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        document.body.classList.add("loaded");
      }, 250);
    });
  </script>
</body>
</html>
