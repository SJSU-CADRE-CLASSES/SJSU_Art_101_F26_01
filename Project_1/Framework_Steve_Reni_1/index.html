<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Framework</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
	<style>
		:root {
			--ink: #171717;
			--paper: #e8e5de;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100svh;
			margin: 0;
			overflow-x: hidden;
			color: var(--ink);
			background: var(--paper);
			font-family: "Space Grotesk", sans-serif;
		}

		button,
		p,
		span {
			overflow-wrap: anywhere;
		}

		main {
			position: relative;
			display: grid;
			min-height: 100svh;
			place-items: center;
			--title-gradient: linear-gradient(115deg, #087f8c 0%, #16b89a 35%, #b7db62 52%, #087f8c 82%, #16b89a 100%);
			overflow: visible;
			background:
				linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent 42%),
				radial-gradient(circle at 75% 25%, rgba(240, 93, 61, 0.18), transparent 28%),
				#d9e8ee;
		}

		main::before {
			position: absolute;
			inset: -8%;
			z-index: 0;
			content: "";
			background: url("pope.png") center 38% / cover no-repeat;
			filter: saturate(0.8) contrast(0.9);
			opacity: 0;
			pointer-events: none;
			transform: scale(1);
			transform-origin: center 38%;
			clip-path: inset(8%);
			transition: opacity 700ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		main:has(.subheader:hover)::before {
			opacity: 0.4;
			transform: scale(1.2);
		}

		main::after {
			position: absolute;
			inset: -8%;
			z-index: 0;
			content: "";
			background: url("Ape1.jpeg") center 38% / cover no-repeat;
			filter: saturate(0.8) contrast(0.9);
			opacity: 0;
			pointer-events: none;
			transform: scale(1);
			transform-origin: center 38%;
			clip-path: inset(8%);
			transition: opacity 700ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		main:has(.subcopy:hover)::after {
			opacity: 0.4;
			transform: scale(1.2);
		}

		.lost-image {
			position: absolute;
			inset: 0;
			z-index: 0;
			background: url("worried-scared.gif") center / contain no-repeat;
			filter: saturate(0.8) contrast(0.9);
			opacity: 0;
			pointer-events: none;
			transform: scale(1);
			transform-origin: center;
			clip-path: inset(0);
			transition: opacity 700ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		main:has(.philosophically-lost:hover, .philosophically-lost:focus-visible) .lost-image {
			opacity: 0.4;
			transform: scale(1.03);
		}

		.philosophically-lost {
			position: absolute;
			top: 50%;
			right: 20vw;
			width: min(32ch, 32vw);
			margin: 0;
			border: 0;
			padding: 0;
			color: rgba(23, 23, 23, 0.65);
			background: transparent;
			font: inherit;
			font-size: clamp(1rem, 2vw, 1.6rem);
			line-height: 1.15;
			text-align: right;
			cursor: pointer;
			transform: translateY(-50%);
			animation: lost-bounce 3.2s ease-in-out infinite;
			transition: color 260ms ease;
		}

		.philosophically-lost:hover,
		.philosophically-lost:focus-visible {
			color: var(--ink);
		}

		.meme-instruction {
			position: absolute;
			top: clamp(16rem, 46vh, 26rem);
			left: 50%;
			width: min(22ch, 34vw);
			margin: 0;
			color: rgba(23, 23, 23, 0.65);
			font-size: clamp(1rem, 2vw, 1.5rem);
			line-height: 1.15;
			text-align: center;
			transform: translateX(-50%);
			animation: meme-oscillate 3.2s ease-in-out infinite;
		}

		@keyframes meme-oscillate {
			0%,
			100% {
				transform: translateX(-50%) translateY(0) rotate(-2deg);
			}
			50% {
				transform: translateX(-50%) translateY(-3px) rotate(2deg);
			}
		}

		@keyframes lost-bounce {
			0%,
			100% {
				transform: translateY(-50%) rotate(10deg);
			}
			50% {
				transform: translateY(calc(-50% - 6px)) rotate(10deg);
			}
		}

		main > * {
			z-index: 1;
		}

		.eyebrow {
			position: absolute;
			top: 32px;
			left: 36px;
			margin: 0;
			color: rgba(23, 23, 23, 0.6);
			font-size: 0.7rem;
			--title-gradient: linear-gradient(115deg, #326ca8 0%, #62a9c4 25%, #f0d35f 42%, #f0d35f 64%, #326ca8 82%, #62a9c4 100%);
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		.tenets {
			display: flex;
			min-height: 100svh;
			align-items: center;
			flex-direction: column;
			justify-content: flex-start;
			padding: clamp(8vh, 11vh, 14vh) 8vw 14vh;
			background: #ddcfc9;
		}

		.metaphysics {
			position: relative;
			overflow: hidden;
			background: #c9ddd5;
		}

		.ethics {
			background: #d2c49a;
		}

		.ethics h2 {
			color: var(--paper);
			--title-gradient: linear-gradient(115deg, #2f6fed 0%, #7bc96f 35%, #f2c14e 52%, #2f6fed 82%, #7bc96f 100%);
		}

		.closing {
			background: url("Happyape.jpg") center / cover no-repeat;
		}

		.principles {
			position: relative;
			overflow: hidden;
		}

		.principles::before {
			position: absolute;
			inset: 0;
			z-index: 0;
			content: "";
			background: url("Upset.gif") center / contain no-repeat;
			filter: saturate(0.8) contrast(0.9);
			opacity: 0;
			pointer-events: none;
			transform: scale(1);
			transition: opacity 700ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		.principles:has(.floating-square:first-child:hover, .floating-square:first-child:focus-visible)::before {
			opacity: 0.4;
			transform: scale(1);
		}

		.principles::after {
			position: absolute;
			inset: 0;
			z-index: 0;
			content: "";
			background: url("fine.jpg") center / contain no-repeat;
			filter: saturate(0.8) contrast(0.9);
			opacity: 0;
			pointer-events: none;
			transform: scale(1);
			transition: opacity 700ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		.principles:has(.floating-square:nth-child(2):hover, .floating-square:nth-child(2):focus-visible)::after {
			opacity: 0.4;
			transform: scale(1.03);
		}

		.principles > * {
			position: relative;
			z-index: 1;
		}

		.metaphysics::before {
			position: absolute;
			inset: 0;
			z-index: 0;
			content: "";
			background: url("Freewill.png") center / contain no-repeat;
			filter: saturate(0.8) contrast(0.9);
			opacity: 0;
			pointer-events: none;
			transform: scale(1);
			transition: opacity 700ms ease, transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		.metaphysics:has(.freewill:hover, .freewill:focus-visible)::before {
			opacity: 0.4;
			transform: scale(1.03);
		}

		.metaphysics > * {
			position: relative;
			z-index: 1;
		}

		.freewill {
			position: absolute;
			grid-column: 3;
			grid-row: 2;
			align-self: start;
			justify-self: center;
			margin: 0;
			border: 0;
			padding: 0;
			color: rgba(23, 23, 23, 0.6);
			background: transparent;
			font: inherit;
			font-size: clamp(1.8rem, 4vw, 3.5rem);
			letter-spacing: 0.08em;
			cursor: pointer;
			transform: translateY(-115%) rotate(10deg);
			animation: freewill-bounce 2.2s ease-in-out infinite;
			transition: color 260ms ease;
		}

		.freewill:hover,
		.freewill:focus-visible {
			color: var(--ink);
		}

		@keyframes freewill-bounce {
			0%,
			100% {
				transform: translateY(-115%) rotate(10deg);
			}
			50% {
				transform: translateY(calc(-115% - 10px)) rotate(10deg);
			}
		}

		.tenets h2 {
			position: relative;
			margin: 0;
			padding: 0 5vw;
			color: var(--ink);
			--title-gradient: linear-gradient(115deg, #087f8c 0%, #16b89a 35%, #b7db62 52%, #087f8c 82%, #16b89a 100%);
			font-family: "Bebas Neue", sans-serif;
			font-size: clamp(4rem, 18vw, 14rem);
			font-weight: 400;
			line-height: 0.92;
			letter-spacing: 0.015em;
			text-align: center;
			transform: perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(var(--lift, 0px));
			transform-origin: center;
			transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), text-shadow 260ms ease;
			will-change: transform;
		}

		.metaphysics h2 {
			--title-gradient: linear-gradient(115deg, #b95757 0%, #d98b50 35%, #e3c15c 52%, #b95757 82%, #d98b50 100%);
		}

		.tenets h2:hover {
			--lift: -7px;
			color: transparent;
			background: var(--title-gradient);
			background-size: 240% 100%;
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			animation: fluid-fill 8s ease-in-out infinite alternate;
			text-shadow: 5px 5px 0 rgba(23, 23, 23, 0.12);
		}

		.square-row {
			display: flex;
			width: min(100%, 88vw);
			gap: clamp(28px, 7vw, 110px);
			align-items: center;
			justify-content: center;
			margin-top: clamp(36px, 7vh, 76px);
		}

		.triangle-row {
			position: relative;
			display: grid;
			width: min(100%, 88vw);
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: clamp(16px, 3vw, 44px);
			align-items: center;
			justify-content: center;
			margin-top: clamp(36px, 7vh, 76px);
		}

		.floating-square {
			display: grid;
			width: clamp(150px, 42vw, 540px);
			height: clamp(150px, 42vw, 540px);
			flex: 0 0 auto;
			place-items: center;
			border: 2px solid rgba(255, 255, 255, 0.88);
			border-radius: 0;
			color: var(--paper);
			background: rgba(23, 23, 23, 0.84);
			font-family: "Bebas Neue", sans-serif;
			font-size: clamp(3rem, 7vw, 6rem);
			line-height: 1;
			cursor: pointer;
			animation: square-float 4.8s ease-in-out infinite;
			transition: width 520ms cubic-bezier(0.22, 1, 0.36, 1), height 520ms cubic-bezier(0.22, 1, 0.36, 1), color 260ms ease, background 260ms ease, box-shadow 260ms ease, transform 260ms ease;
		}

		.floating-triangle {
			display: grid;
			width: clamp(190px, 26vw, 380px);
			height: clamp(190px, 26vw, 380px);
			--hover-scale: 1.18;
			flex: 0 0 auto;
			place-items: center;
			border: 0;
			padding: 0;
			color: var(--paper);
			background: rgba(23, 23, 23, 0.84);
			font-family: "Bebas Neue", sans-serif;
			font-size: clamp(3rem, 7vw, 6rem);
			line-height: 1;
			cursor: pointer;
			border-radius: 50%;
			overflow: hidden;
			animation: square-float 4.8s ease-in-out infinite;
			transition: color 260ms ease, background 260ms ease, box-shadow 260ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		.hexagon-row {
			display: grid;
			width: min(100%, 88vw);
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: clamp(80px, 12vw, 180px);
			align-items: center;
			justify-content: center;
			margin-top: clamp(36px, 7vh, 76px);
		}

		.floating-hexagon {
			display: grid;
			width: clamp(260px, 38vw, 520px);
			height: clamp(260px, 38vw, 520px);
			--hover-scale: 1.16;
			place-items: center;
			border: 0;
			padding: 0;
			color: var(--paper);
			background: rgba(23, 23, 23, 0.88);
			font-family: "Bebas Neue", sans-serif;
			font-size: clamp(3rem, 7vw, 6rem);
			line-height: 1;
			cursor: pointer;
			clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0 50%);
			animation: square-float 4.8s ease-in-out infinite;
			transition: color 260ms ease, background 260ms ease, filter 260ms ease, transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
		}

		.floating-hexagon:first-child {
			justify-self: end;
		}

		.floating-hexagon:nth-child(2) {
			justify-self: start;
		}

		.hexagon-label,
		.hexagon-copy {
			grid-area: 1 / 1;
		}

		.hexagon-copy {
			max-width: 72%;
			padding: 0 1rem;
			font-family: "Space Grotesk", sans-serif;
			font-size: clamp(0.9rem, 1.6vw, 1.25rem);
			font-weight: 500;
			line-height: 1.3;
			text-align: center;
			opacity: 0;
			transition: opacity 360ms ease 120ms;
		}

		.triangle-label,
		.triangle-copy {
			grid-area: 1 / 1;
		}

		.triangle-copy {
			max-width: 34ch;
			padding: 0 1rem;
			font-family: "Space Grotesk", sans-serif;
			font-size: clamp(0.95rem, 1.8vw, 1.35rem);
			font-weight: 500;
			line-height: 1.3;
			text-align: center;
			opacity: 0;
			transition: opacity 360ms ease 120ms;
		}

		.floating-triangle:first-child {
			grid-column: 1 / -1;
			justify-self: center;
			margin-top: 0;
		}

		.square-label,
		.square-copy {
			grid-area: 1 / 1;
		}

		.square-label {
			opacity: 1;
			transition: opacity 140ms ease;
		}

		.square-copy {
			max-width: 32ch;
			padding: 0 2rem;
			font-family: "Space Grotesk", sans-serif;
			font-size: clamp(2rem, 4.5vw, 4rem);
			font-weight: 500;
			line-height: 1.25;
			text-align: center;
			opacity: 0;
			transition: opacity 360ms ease 120ms;
		}

		.floating-square:first-child {
			margin-top: 24px;
		}

		.floating-square:nth-child(2) {
			width: clamp(140px, 37vw, 470px);
			height: clamp(140px, 37vw, 470px);
			margin-top: -30px;
			animation-delay: -2.1s;
		}

		.floating-triangle:nth-child(2) {
			width: clamp(170px, 22vw, 320px);
			height: clamp(170px, 22vw, 320px);
			--hover-scale: 1.55;
			margin-top: 0;
			position: relative;
			left: clamp(42px, 5vw, 80px);
			margin-top: -30px;
			animation-delay: -2.1s;
		}

		.floating-triangle:nth-child(3) {
			grid-column: 3;
			grid-row: 2;
			width: clamp(180px, 24vw, 350px);
			height: clamp(180px, 24vw, 350px);
			--hover-scale: 1.22;
			position: relative;
			left: clamp(16px, 3vw, 40px);
		}

		.floating-square:hover,
		.floating-square:focus-visible,
		.floating-square.is-active {
			width: min(clamp(280px, 66vw, 960px), 90vw);
			height: clamp(270px, 30vw, 390px);
			color: var(--paper);
			background: rgba(23, 23, 23, 0.94);
			box-shadow: 8px 8px 0 rgba(23, 23, 23, 0.14);
			animation-play-state: paused;
			transform: translateY(-9px) rotate(-3deg);
		}

		.floating-square:hover .square-label,
		.floating-square:focus-visible .square-label,
		.floating-square.is-active .square-label {
			opacity: 0;
		}

		.floating-square:hover .square-copy,
		.floating-square:focus-visible .square-copy,
		.floating-square.is-active .square-copy {
			opacity: 1;
		}

		.floating-square:nth-child(2):hover,
		.floating-square:nth-child(2):focus-visible,
		.floating-square:nth-child(2).is-active {
			width: min(clamp(300px, 75vw, 1080px), 90vw);
			transform: translateY(-9px) rotate(3deg);
		}

		.floating-triangle:hover,
		.floating-triangle:focus-visible,
		.floating-triangle.is-active {
			color: var(--paper);
			background: rgba(23, 23, 23, 0.94);
			box-shadow: 8px 8px 0 rgba(23, 23, 23, 0.14);
			animation: none;
			transform: translateY(-9px) rotate(-3deg) scale(var(--hover-scale));
		}

		.floating-triangle:nth-child(2):hover,
		.floating-triangle:nth-child(2):focus-visible,
		.floating-triangle:nth-child(2).is-active {
			transform: translateY(-9px) rotate(3deg) scale(var(--hover-scale));
		}

		.floating-triangle:first-child:hover,
		.floating-triangle:first-child:focus-visible,
		.floating-triangle:first-child.is-active {
			--hover-scale: 1.18;
			z-index: 2;
		}

		.floating-triangle:first-child:hover .triangle-label,
		.floating-triangle:first-child:focus-visible .triangle-label,
		.floating-triangle:first-child.is-active .triangle-label {
			opacity: 0;
		}

		.floating-triangle:first-child:hover .triangle-copy,
		.floating-triangle:first-child:focus-visible .triangle-copy,
		.floating-triangle:first-child.is-active .triangle-copy {
			opacity: 1;
		}

		.floating-triangle:nth-child(2):hover .triangle-label,
		.floating-triangle:nth-child(2):focus-visible .triangle-label,
		.floating-triangle:nth-child(2).is-active .triangle-label {
			opacity: 0;
		}

		.floating-triangle:nth-child(2):hover .triangle-copy,
		.floating-triangle:nth-child(2):focus-visible .triangle-copy,
		.floating-triangle:nth-child(2).is-active .triangle-copy {
			opacity: 1;
		}

		.floating-triangle:nth-child(3):hover .triangle-label,
		.floating-triangle:nth-child(3):focus-visible .triangle-label,
		.floating-triangle:nth-child(3).is-active .triangle-label {
			opacity: 0;
		}

		.floating-triangle:nth-child(3):hover .triangle-copy,
		.floating-triangle:nth-child(3):focus-visible .triangle-copy,
		.floating-triangle:nth-child(3).is-active .triangle-copy {
			opacity: 1;
		}

		.floating-triangle:nth-child(2):hover,
		.floating-triangle:nth-child(2):focus-visible,
		.floating-triangle:nth-child(2).is-active {
			z-index: 2;
		}

		.floating-triangle:nth-child(3):hover,
		.floating-triangle:nth-child(3):focus-visible,
		.floating-triangle:nth-child(3).is-active {
			z-index: 2;
		}

		.floating-hexagon:hover,
		.floating-hexagon:focus-visible,
		.floating-hexagon.is-active {
			color: var(--paper);
			background: rgba(23, 23, 23, 0.94);
			box-shadow: 8px 8px 0 rgba(23, 23, 23, 0.14);
			animation: none;
			transform: translateY(-9px) rotate(-3deg) scale(var(--hover-scale));
			z-index: 2;
		}

		.floating-hexagon:nth-child(2):hover,
		.floating-hexagon:nth-child(2):focus-visible,
		.floating-hexagon:nth-child(2).is-active {
			transform: translateY(-9px) rotate(3deg) scale(var(--hover-scale));
		}

		.floating-hexagon:hover .hexagon-label,
		.floating-hexagon:focus-visible .hexagon-label,
		.floating-hexagon.is-active .hexagon-label {
			opacity: 0;
		}

		.floating-hexagon:hover .hexagon-copy,
		.floating-hexagon:focus-visible .hexagon-copy,
		.floating-hexagon.is-active .hexagon-copy {
			opacity: 1;
		}

		@keyframes square-float {
			0%,
			100% {
				transform: translateY(-5px);
			}
			50% {
				transform: translateY(7px);
			}
		}

		.wordmark {
			position: relative;
			margin: 0;
			padding: 0 5vw;
			color: var(--ink);
			--title-gradient: linear-gradient(115deg, #d65a91 0%, #e98ab0 25%, #f0d35f 42%, #f0d35f 64%, #d65a91 82%, #e98ab0 100%);
			font-family: "Bebas Neue", sans-serif;
			font-size: clamp(5.25rem, 17vw, 13rem);
			font-weight: 400;
			line-height: 0.92;
			letter-spacing: 0.015em;
			text-align: center;
			transform: perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)) translateY(var(--lift, 0px));
			transform-origin: center;
			transition: transform 260ms cubic-bezier(0.22, 1, 0.36, 1), text-shadow 260ms ease;
			will-change: transform;
		}

		.wordmark:hover {
			--lift: -7px;
			color: transparent;
			background: var(--title-gradient);
			background-size: 240% 100%;
			-webkit-background-clip: text;
			background-clip: text;
			-webkit-text-fill-color: transparent;
			animation: fluid-fill 8s ease-in-out infinite alternate;
			text-shadow: 5px 5px 0 rgba(23, 23, 23, 0.12);
		}

		.subheader {
			margin: 0.25rem 0 0;
			font-size: clamp(1.25rem, 3vw, 2rem);
			font-weight: 500;
			text-align: center;
		}

		.subcopy {
			margin: 0.2rem 0 0;
			font-size: clamp(0.9rem, 1.8vw, 1.2rem);
			text-align: center;
		}

		.scroll-indicator {
			width: clamp(3.5rem, 8vw, 6rem);
			aspect-ratio: 1.8;
			margin-top: 1.4rem;
			background: #171717;
			clip-path: polygon(0 0, 100% 0, 50% 100%);
			animation: indicator-bounce 1.8s ease-in-out infinite;
			transition: background 420ms ease;
		}

		.scroll-indicator:hover {
			background: linear-gradient(115deg, #d65a91 0%, #e98ab0 25%, #f0d35f 42%, #f0d35f 64%, #d65a91 82%, #e98ab0 100%);
			background-size: 240% 100%;
			animation: indicator-bounce 1.8s ease-in-out infinite, fluid-fill 8s ease-in-out infinite alternate;
		}

		@keyframes indicator-bounce {
			0%,
			100% {
				transform: translateY(-4px);
			}
			50% {
				transform: translateY(9px);
			}
		}

		@keyframes fluid-fill {
			0% {
				background-position: 0% 50%;
			}
			100% {
				background-position: 100% 50%;
			}
		}

		.caption {
			position: absolute;
			right: 36px;
			bottom: 32px;
			margin: 0;
			color: rgba(23, 23, 23, 0.6);
			font-size: 0.7rem;
			letter-spacing: 0.08em;
			text-transform: uppercase;
		}

		@media (max-width: 600px) {
			.tenets {
				padding-right: 5vw;
				padding-left: 5vw;
			}

			.square-row {
				width: 100%;
				gap: 4vw;
			}

			.triangle-row {
				width: 100%;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 4vw;
			}

			.floating-square:first-child,
			.floating-square:nth-child(2) {
				margin-top: 0;
			}

			.floating-square:hover,
			.floating-square:focus-visible,
			.floating-square.is-active,
			.floating-square:nth-child(2):hover,
			.floating-square:nth-child(2):focus-visible,
			.floating-square:nth-child(2).is-active {
				width: 88vw;
				height: clamp(170px, 42vw, 270px);
			}

			.floating-triangle:hover,
			.floating-triangle:focus-visible,
			.floating-triangle.is-active {
				--hover-scale: 1.55;
			}

			.floating-triangle:nth-child(2):hover,
			.floating-triangle:nth-child(2):focus-visible,
			.floating-triangle:nth-child(2).is-active {
				--hover-scale: 1.35;
			}

			.floating-triangle:nth-child(3) {
				grid-column: 2;
				left: -16px;
			}

			.floating-triangle:nth-child(3):hover,
			.floating-triangle:nth-child(3):focus-visible,
			.floating-triangle:nth-child(3).is-active {
				--hover-scale: 1.08;
			}

			.freewill {
				grid-column: 2;
			}

			.hexagon-row {
				width: 100%;
				grid-template-columns: 1fr;
				gap: 8px;
			}

			.floating-hexagon {
				width: clamp(220px, 65vw, 340px);
				height: clamp(220px, 65vw, 340px);
				justify-self: center;
			}

			.hexagon-copy {
				padding: 0 0.75rem;
				font-size: clamp(0.72rem, 2.7vw, 1rem);
			}

			.square-copy {
				padding: 0 1rem;
				font-size: clamp(1.1rem, 4vw, 2rem);
			}

			.eyebrow {
				top: 24px;
				left: 22px;
			}

			.caption {
				right: 22px;
				bottom: 24px;
			}

			.philosophically-lost {
				top: 58%;
				right: 20vw;
				width: min(70vw, 32ch);
			}
		}
	</style>
</head>
<body>
	<main>
		<span class="lost-image" aria-hidden="true"></span>
		<button class="philosophically-lost" type="button" aria-label="Reveal worried image">Philosophically lost? Don't worry you can borrow mine for now!	
		</button>
		<p class="meme-instruction">Mouse Over Text for Memes!</p>
		<h1 class="wordmark" data-label="Framework">Framework</h1>
		<p class="subheader">y tho?</p>
		<p class="subcopy">Basic Philosophy for Basic Apes Like Me.</p>
		<span class="scroll-indicator" aria-hidden="true"></span>
		<p class="caption">Move closer</p>
	</main>
	<section class="tenets metaphysics" aria-labelledby="metaphysics-title">
		<h2 id="metaphysics-title" data-label="Metaphysics">Metaphysics</h2>
		<div class="triangle-row" aria-label="Choose a metaphysics principle">
			<button class="floating-triangle" type="button" aria-pressed="false">
				<span class="triangle-label">I</span>
				<span class="triangle-copy">Monism-is a philosophical view that all of reality is made of a single ultimate substance, principle, or unity rather than multiple independent parts.</span>
			</button>
			<button class="floating-triangle" type="button" aria-pressed="false">
				<span class="triangle-label">II</span>
				<span class="triangle-copy">Physicalism- the philosophical view that everything in reality is ultimately physical, meaning there is nothing above, outside, or immaterial to the physical world.</span>
			</button>
			<button class="floating-triangle" type="button" aria-pressed="false">
				<span class="triangle-label">III</span>
				<span class="triangle-copy">Determinism - The philosophical and scientific concept that all events, including human actions and choices, are the inevitable result of preceding events and the laws of nature.</span>
			</button>
			<button class="freewill" type="button" aria-label="Reveal free will image">Freewill?</button>
		</div>
	</section>
	<section class="tenets ethics" aria-labelledby="ethics-title">
		<h2 id="ethics-title" data-label="Ethics">Ethics</h2>
		<div class="hexagon-row" aria-label="Choose an ethical principle">
			<button class="floating-hexagon" type="button" aria-pressed="false">
				<span class="hexagon-label">I</span>
				<span class="hexagon-copy">Consequentialism- an ethical theory that judges whether an action is right or wrong based entirely on its outcomes or consequences.</span>
			</button>
			<button class="floating-hexagon" type="button" aria-pressed="false">
				<span class="hexagon-label">II</span>
				<span class="hexagon-copy">Rule-utilitarianism- an ethical theory stating that an action is morally right if it conforms to a set of rules that, when generally followed, leads to the greatest overall good.</span>
			</button>
		</div>
	</section>
	<section class="tenets principles" aria-labelledby="tenets-title">
		<h2 id="tenets-title" data-label="Principles">Principles</h2>
		<div class="square-row" aria-label="Choose a tenet">
			<button class="floating-square" type="button" aria-pressed="false">
				<span class="square-label">I</span>
				<span class="square-copy">The Well-Being of Conscious Creatures</span>
			</button>
			<button class="floating-square" type="button" aria-pressed="false">
				<span class="square-label">II</span>
				<span class="square-copy">Avoiding The Worst Possible Misery for Everyone</span>
			</button>
		</div>
	</section>
	<section class="tenets closing" aria-labelledby="closing-title">
		<h2 id="closing-title" data-label="Now go be a good ape.">Now go be a good ape.</h2>
	</section>

	<script>
		const interactiveTitles = document.querySelectorAll(".wordmark, .tenets h2");
		const maxTilt = 4;
		const squares = document.querySelectorAll(".floating-square, .floating-triangle, .floating-hexagon");

		squares.forEach((square) => {
			square.addEventListener("click", () => {
				squares.forEach((item) => {
					item.classList.remove("is-active");
					item.setAttribute("aria-pressed", "false");
				});
				square.classList.add("is-active");
				square.setAttribute("aria-pressed", "true");
			});
		});

		interactiveTitles.forEach((title) => {
			title.parentElement.addEventListener("pointermove", (event) => {
			const bounds = title.getBoundingClientRect();
			const nearX = Math.max(bounds.left - 110, Math.min(event.clientX, bounds.right + 110));
			const nearY = Math.max(bounds.top - 110, Math.min(event.clientY, bounds.bottom + 110));
			const horizontalDistance = Math.abs(event.clientX - nearX);
			const verticalDistance = Math.abs(event.clientY - nearY);
			const proximity = Math.max(0, 1 - Math.hypot(horizontalDistance, verticalDistance) / 110);

			if (proximity === 0) {
				title.style.setProperty("--tilt-x", "0deg");
				title.style.setProperty("--tilt-y", "0deg");
				return;
			}

			const centerX = bounds.left + bounds.width / 2;
			const centerY = bounds.top + bounds.height / 2;
			const tiltY = ((event.clientX - centerX) / (bounds.width / 2)) * maxTilt * proximity;
			const tiltX = ((centerY - event.clientY) / (bounds.height / 2)) * maxTilt * proximity;

			title.style.setProperty("--tilt-x", `${tiltX}deg`);
			title.style.setProperty("--tilt-y", `${tiltY}deg`);
		});

			title.parentElement.addEventListener("pointerleave", () => {
				title.style.setProperty("--tilt-x", "0deg");
				title.style.setProperty("--tilt-y", "0deg");
			});
		});
	</script>
</body>
</html>
