<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toon Quest</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            position: relative;
            min-height: 100vh;
            padding-bottom: 110px;
        }

        .topbar {
            background: #d11a1a;
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .topbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 18px;
            font-size: 1.1rem;
        }

        .image-link {
            display: block;
            margin: 30px auto 0;
            width: fit-content;
            position: relative;
            z-index: 2;
        }

        .image-link img {
            width: 620px;
            max-width: 82vw;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .bottom-link {
            display: inline-block;
            margin: 18px auto 0;
            z-index: 5;
            background: rgba(255,255,255,0.82);
            color: #b10d0d;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 10px 18px;
            border-radius: 999px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.16);
        }

        .glitch-band {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 86px;
            pointer-events: none;
            z-index: 3;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255, 90, 160, 0.2) 0px,
                rgba(255, 90, 160, 0.2) 2px,
                rgba(255, 0, 0, 0.22) 2px,
                rgba(255, 0, 0, 0.22) 4px,
                rgba(30, 255, 130, 0.18) 4px,
                rgba(30, 255, 130, 0.18) 6px,
                rgba(255, 255, 255, 0.02) 6px,
                rgba(255, 255, 255, 0.02) 8px
            );
            box-shadow: inset 0 12px 18px rgba(255, 90, 160, 0.12), inset 0 -10px 18px rgba(30,255,130,0.08);
            animation: glitchBand 1.8s steps(2, end) infinite;
        }

        .glitch-band::before,
        .glitch-band::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, rgba(255, 90, 160, 0.5), rgba(255, 0, 0, 0.26), rgba(30, 255, 130, 0.28));
            mix-blend-mode: screen;
        }

        .glitch-band::before {
            transform: translateX(-8px);
            clip-path: inset(0 0 75% 0);
            animation: glitchShiftA 1.1s infinite steps(2, end);
        }

        .glitch-band::after {
            transform: translateX(8px);
            clip-path: inset(30% 0 0 0);
            animation: glitchShiftB 1.3s infinite steps(2, end);
        }

        @keyframes glitchBand {
            0%, 100% { opacity: 0.7; transform: translateY(0); }
            15% { opacity: 1; }
            30% { opacity: 0.45; transform: translateY(3px); }
            50% { opacity: 0.9; }
            70% { opacity: 0.55; transform: translateY(-2px); }
            85% { opacity: 1; }
        }

        @keyframes glitchShiftA {
            0% { clip-path: inset(0 0 88% 0); }
            25% { clip-path: inset(18% 0 54% 0); }
            50% { clip-path: inset(62% 0 12% 0); }
            75% { clip-path: inset(8% 0 68% 0); }
            100% { clip-path: inset(36% 0 28% 0); }
        }

        @keyframes glitchShiftB {
            0% { clip-path: inset(76% 0 0 0); }
            25% { clip-path: inset(42% 0 30% 0); }
            50% { clip-path: inset(12% 0 70% 0); }
            75% { clip-path: inset(58% 0 12% 0); }
            100% { clip-path: inset(22% 0 56% 0); }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="index.html">Main Menu</a>
        <a href="second.html">Toon Quest</a>
        <a href="video.html">Release the Toons</a>
        <a href="escape-activated.html">Escape</a>
    </nav>


    <a href="https://spark-toons.github.io/toonquest/comicintro.html" class="image-link" target="_blank" rel="noopener noreferrer">
        <img src="welcomepage.png" alt="Sparky Toons icon" />
    </a>

    <a class="bottom-link" href="https://spark-toons.github.io/toonquest/comicintro.html" target="_blank" rel="noopener noreferrer">
        CLICK HERE TO PLAY MY PREVIOUS GAME!
    </a>

    <div class="glitch-band" aria-hidden="true"></div>
</body>
</html>
