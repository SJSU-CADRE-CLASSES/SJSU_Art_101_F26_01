<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main Menu</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f7f7f7;
        }

        .topbar {
            background: #d11a1a;
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .topbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            margin: 0 18px;
            font-size: 1.1rem;
        }

        .content {
            padding: 30px;
        }

        .speech-bubble {
            position: relative;
            display: inline-block;
            max-width: 650px;
            background: #ffffff;
            border: 4px solid #000000;
            border-radius: 20px;
            padding: 18px 22px;
            margin: 0 auto 20px;
            box-shadow: 0 6px 0 rgba(0,0,0,0.12);
            font-weight: bold;
            text-align: center;
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -20px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 22px solid #000000;
        }

        .speech-bubble::before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -12px;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 16px solid #ffffff;
            z-index: 1;
        }

        .speech-bubble h1,
        .speech-bubble h3,
        .speech-bubble h4 {
            margin: 8px 0;
        }

        .glitch-word {
            position: relative;
            display: inline-block;
            color: #ff2a2a;
            text-shadow: 2px 0 #00d9ff, -2px 0 #ffb703;
            animation: glitchWord 0.8s infinite alternate;
            text-decoration: none;
            cursor: pointer;
        }

        .glitch-word::before,
        .glitch-word::after {
            content: "funny";
            position: absolute;
            inset: 0;
            opacity: 0.8;
        }

        .glitch-word::before {
            color: #00d9ff;
            transform: translate(-3px, 1px);
            clip-path: inset(0 0 55% 0);
        }

        .glitch-word::after {
            color: #ffb703;
            transform: translate(3px, -1px);
            clip-path: inset(55% 0 0 0);
        }

        @keyframes glitchWord {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 1px); }
            40% { transform: translate(2px, -1px); }
            60% { transform: translate(-1px, 1px); }
            80% { transform: translate(2px, 2px); }
            100% { transform: translate(0, 0); }
        }

        .sparky-image {
            display: block;
            width: 320px;
            max-width: 80vw;
            height: auto;
            margin: 20px auto 0;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <a href="index.html">Main Menu</a>
        <a href="second.html">Toon Quest</a>
        <a href="video.html">Release the Toons</a>
        <a href="escape-activated.html">Escape</a>
    </nav>

    <div class="content">
        <div class="speech-bubble">
            <h1>Heyo everybody!</h1>
            <h3>I'm Sparky the toon dog</h3>
            <h3>I hope you enjoy my slice of the internet!</h3>
            <h4>Sometimes what you see isn't what it seems. The toons around here get a little... <a href="https://www.omfgdogs.com/" class="glitch-word">funny</a>.</h4>
        </div>

        <img class="sparky-image" src="sparkytoonsicon.png" alt="Sparky the toon dog" />
    </div>
</body>
</html>
