<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERROR</title>
    <style>
        :root {
            --red: #ff1f1f;
            --dark: #0d0d0d;
            --white: #f7f7f7;
            --orange: #ffb000;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--dark);
            color: var(--white);
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, rgba(255,0,0,0.18), rgba(0,0,0,0.9) 40%, #000 100%);
            padding: 30px 20px;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.08),
                rgba(255,255,255,0.08) 2px,
                transparent 2px,
                transparent 6px
            );
        }

        body::after {
            background: rgba(255, 0, 0, 0.16);
            animation: pulseRed 0.4s infinite alternate;
        }

        .error-box {
            position: relative;
            z-index: 2;
            display: inline-block;
            text-align: center;
            padding: 12px 12px 16px;
            border: 4px solid rgba(255,255,255,0.35);
            background: rgba(15, 15, 15, 0.8);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            animation: flicker 0.15s infinite alternate;
            width: fit-content;
            max-width: min(850px, 92vw);
            max-height: 90vh;
        }

        .error-code {
            font-size: clamp(2rem, 5vw, 5rem);
            font-weight: 900;
            letter-spacing: 0.2em;
            color: var(--red);
            text-shadow: 0 0 16px rgba(255, 31, 31, 1), 0 0 30px rgba(255, 31, 31, 0.8);
            position: relative;
            animation: glitch 0.8s infinite alternate;
        }

        .error-code::before,
        .error-code::after {
            content: "WARNING";
            position: absolute;
            inset: 0;
            opacity: 0.9;
        }

        .error-code::before {
            color: var(--orange);
            transform: translate(-4px, 1px);
            clip-path: inset(0 0 52% 0);
            animation: glitchBefore 0.9s infinite linear alternate-reverse;
        }

        .error-code::after {
            color: var(--white);
            transform: translate(4px, -1px);
            clip-path: inset(52% 0 0 0);
            animation: glitchAfter 0.9s infinite linear alternate;
        }

        .message {
            margin-top: 18px;
            font-size: clamp(1rem, 2vw, 2rem);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--white);
            font-weight: 700;
        }

        .creepy-dog {
            display: block;
            width: auto;
            max-width: min(540px, 72vw);
            max-height: min(52vh, 420px);
            height: auto;
            margin: 12px auto 0;
            object-fit: contain;
            filter: grayscale(1) contrast(1.3) brightness(0.9);
            animation: dogFlash 0.6s infinite alternate;
            transform-origin: center;
        }

        @keyframes glitch {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-3px, 2px); }
            20% { transform: translate(3px, -2px); }
            30% { transform: translate(-4px, 0); }
            40% { transform: translate(2px, 3px); }
            50% { transform: translate(-2px, -1px); }
            60% { transform: translate(4px, -2px); }
            70% { transform: translate(-3px, 2px); }
            80% { transform: translate(2px, -1px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes glitchBefore {
            0% { clip-path: inset(0 0 60% 0); }
            20% { clip-path: inset(28% 0 32% 0); }
            40% { clip-path: inset(64% 0 8% 0); }
            60% { clip-path: inset(12% 0 60% 0); }
            80% { clip-path: inset(70% 0 5% 0); }
            100% { clip-path: inset(34% 0 30% 0); }
        }

        @keyframes glitchAfter {
            0% { clip-path: inset(42% 0 28% 0); }
            20% { clip-path: inset(78% 0 2% 0); }
            40% { clip-path: inset(16% 0 62% 0); }
            60% { clip-path: inset(54% 0 18% 0); }
            80% { clip-path: inset(6% 0 72% 0); }
            100% { clip-path: inset(60% 0 12% 0); }
        }

        @keyframes pulseRed {
            0% { opacity: 0.1; }
            100% { opacity: 0.32; }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            20% { opacity: 0.85; }
            25% { opacity: 1; }
            40% { opacity: 0.72; }
            70% { opacity: 1; }
            85% { opacity: 0.8; }
        }

        @keyframes dogFlash {
            0% {
                opacity: 0.25;
                transform: scale(0.98) translateY(4px);
            }
            50% {
                opacity: 1;
                transform: scale(1.02) translateY(-2px);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.96) translateY(2px);
            }
        }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">WARNING: ROUGE TOON</div>
        <div class="message">Device hacked</div>
        <img class="creepy-dog" src="ErrorSparky.png" alt="creepy cartoon dog" />
    </div>
</body>
</html>
