<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>World-Net</title>
    <style>
      :root {
        --page-bg: #d8d2c9;
        --paper: #f5f3ef;
        --paper-2: #eeebe5;
        --ink: #2d3741;
        --muted: #57636d;
        --line: #5f6b74;
        --line-soft: #7b868d;
        --panel: #f0f2f3;
        --shadow: rgba(17, 23, 29, 0.08);
        --button: #dfe7e8;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--page-bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
      }

      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px;
      }

      .page {
        width: min(1180px, 94vw);
        min-height: 880px;
        background: linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
        border: 2px solid var(--line);
        box-shadow: 0 0 0 1px rgba(71, 79, 86, 0.1), 0 10px 18px var(--shadow);
        position: relative;
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(255,255,255,0.1), transparent 75%);
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 1;
        padding: 18px 26px 16px;
      }

      .masthead {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 92px;
        margin-bottom: 12px;
      }

      .masthead::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 48%;
        height: 2px;
        background: var(--line);
      }

      .title {
        position: relative;
        z-index: 1;
        margin: 0;
        padding: 0 18px;
        font-size: clamp(2.8rem, 5vw, 6.5rem);
        line-height: 1;
        letter-spacing: 0.08em;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--ink);
      }

      .orbit {
        position: absolute;
        right: 24px;
        top: 50%;
        width: 22px;
        height: 22px;
        border: 2px solid var(--line);
        border-radius: 50%;
        transform: translateY(-50%);
      }

      .dot-row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 0 0 16px 8px;
      }

      .dot-row span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: block;
      }

      .dot-row .r { background: #b75d5a; }
      .dot-row .g { background: #4c7d6f; }
      .dot-row .b { background: #5d7ea8; }
      .dot-row .o { background: #a68e5a; }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(170px, 1fr));
        gap: 18px 20px;
        margin-top: 8px;
      }

      .grid-card {
        position: relative;
        display: block;
        height: 170px;
        border: 2px solid var(--line);
        background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(203,209,212,0.12));
        text-decoration: none;
        color: inherit;
        box-shadow: inset 0 0 0 1px rgba(90, 98, 105, 0.08);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .grid-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 2px 0 rgba(67, 75, 82, 0.08), inset 0 0 0 1px rgba(90, 98, 105, 0.08);
      }

      .grid-card::before {
        content: "";
        position: absolute;
        inset: 16px 18px 18px 18px;
        border: 1.5px solid var(--line-soft);
      }

      .grid-card::after {
        content: "";
        position: absolute;
        left: 22px;
        right: 22px;
        top: 38px;
        height: 8px;
        border-top: 2px solid var(--line-soft);
      }

      .card-note {
        position: absolute;
        left: 22px;
        top: 16px;
        font-size: clamp(1rem, 1.3vw, 1.5rem);
        color: var(--muted);
        letter-spacing: 0.05em;
        text-transform: none;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 28px;
        padding-top: 14px;
        border-top: 2px solid var(--line);
        font-size: clamp(1.05rem, 1.7vw, 1.8rem);
        color: var(--muted);
      }

      .footer span {
        display: inline-block;
        min-width: 150px;
      }

      .footer .center {
        text-align: center;
        flex: 1;
      }

      .footer .right {
        text-align: right;
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, minmax(150px, 1fr));
        }
      }

      @media (max-width: 560px) {
        .page {
          width: min(94vw, 540px);
        }

        .content {
          padding: 14px 14px 12px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .footer {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="content">
        <header class="masthead">
          <h1 class="title">WORLD-NET</h1>
          <div class="orbit" aria-hidden="true"></div>
        </header>

        <div class="dot-row" aria-hidden="true">
          <span class="r"></span>
          <span class="g"></span>
          <span class="b"></span>
          <span class="o"></span>
        </div>

        <div class="grid" aria-label="World Net archive grid">
          <a href="events.html" class="grid-card" aria-label="Open events page">
            <div class="card-note">Thread</div>
          </a>
          <div class="grid-card">
            <div class="card-note">Field</div>
          </div>
          <div class="grid-card">
            <div class="card-note">Archive</div>
          </div>

          <div class="grid-card">
            <div class="card-note">Signal</div>
          </div>
          <div class="grid-card">
            <div class="card-note">Outpost</div>
          </div>
          <div class="grid-card">
            <div class="card-note">Index</div>
          </div>
        </div>

        <div class="footer">
          <span>Recycle paper</span>
          <span class="center">Community</span>
          <span class="right">About us</span>
        </div>
      </div>
    </div>
  </body>
</html>
